function update_clk(clkn, clkr, clku, d, tzn, tzr){
	var hr = d.getHours();
	var mn = d.getMinutes();
	var sc = d.getSeconds();

	clkn.value = ts(hr, mn, sc) + " UTC" + tzs(tzn);
	if (tzn != tzr) clkn.value += "夏";

	// 当前是夏令时
	if (tzr != tzn) {
		mn -= tzn - tzr;
		while (mn < 0) {
			mn += 60;
			if (--hr < 0) hr += 24;
		}
		clkr.value = ts(hr, mn, sc) + " UTC" + tzs(tzr);
		clkr.hidden = false;
	} else clkr.hidden = true;

	// 当前非UTC+0时区
	if (tzn && tzr) {
		hr = d.getUTCHours();
		mn = d.getUTCMinutes();
		sc = d.getUTCSeconds();
		clku.value = ts(hr, mn, sc) + " UTC";
		clku.hidden = false;
	} else clku.hidden = true;
}

function ts(hr, mn, sc){
	if (hr < 10) hr = "0" + hr;
	if (mn < 10) mn = "0" + mn;
	if (sc < 10) sc = "0" + sc;
	return hr + ":" + mn + ":" + sc;
}

function tzs(tz){
	var tzm = tz % 60;
	var tzh = (tz - tzm) / 60;
	var str = "";
	if (tz > 0) {
		if (tzh < 10) tzh = "0" + tzh;
		str = "+" + tzh;
	} else if (tz < 0) {
		tzh = -tzh;
		if (tzh < 10) tzh = "0" + tzh;
		str = "-" + tzh;
		tzm = -tzm;
	}
	if (tzm) str += ":" + tzm;
	return str;
}

function update(jd, tz){
	if (isNaN(jd)) return;
	document.getElementById("jd").value = jd;

	var t = jdtot(jd, tz);
	document.getElementById("hr").selectedIndex = t.hms.hr;
	document.getElementById("mn").selectedIndex = t.hms.mn;
	document.getElementById("sc").selectedIndex = t.hms.sc;

	var wk = jdtow(t.jdn);
	var gz = jdtogz(t.jdn);
	document.getElementById("dgz").innerHTML = "周" + WK[wk] + " " + TG[gz%10] + DZ[gz%12] + "(" + (gz+1) + ")";

	update_c(t.jdn, "cm", AUTO, tz);
	update_c(t.jdn, "gg", GREGORIAN, tz);
	update_c(t.jdn, "jl", JULIAN, tz);
	update_c(t.jdn, "g32", GREGORIAN_3200, tz);
	document.getElementById("ggl").style.fontWeight = t.jdn>JD1582_10_4 ? "bold" : "normal";
	document.getElementById("jll").style.fontWeight = t.jdn>JD1582_10_4 ? "normal" : "bold";

	var my = jdtomaya(t.jdn);
	document.getElementById("mp").value = my.pre;
	document.getElementById("mhy").selectedIndex = my.hy;
	document.getElementById("mty").selectedIndex = my.ty;
	document.getElementById("my").selectedIndex = my.y;
	document.getElementById("mm").selectedIndex = my.m;
	document.getElementById("md").selectedIndex = my.d;
	document.getElementById("tk").innerHTML = "卓尔金历：" + my.tnum + " " + TNAME[my.tname] + "(" + my.tname + ")";
	document.getElementById("hb").innerHTML = "哈布历：" + my.hbd + " " + HBM[my.hbm] + "(" + my.hbm + ")";
}

	} else {
		y = 1 - y;
		elem.namedItem("era").selectedIndex = 1;
	}
	elem.namedItem("y").value = y;
	elem.namedItem("m").selectedIndex = d.m-1;
	elem.namedItem("d").selectedIndex = d.d-1;

	if (id !="cm") return;

	// 月历
	var cmc = document.getElementById("cmc");
	cmc.innerHTML = "";

	// 上月首
	var jd0 = dtojd(d.y, d.m-1, 1, type);
	// 本月首
	var jd1 = dtojd(d.y, d.m, 1, type);
	// 下月首
	var jd2 = dtojd(d.y, d.m+1, 1, type);
	// 上月天数
	var n0 = jd1 - jd0;
	// 本月天数
	var n1 = jd2 - jd1;
	// 月首周内偏移
	var delta = jdtow(jd1);
	// 日历行数
	var ln = Math.ceil((n1 + delta) / 7) + 1;
	// 改历修正
	if (n0 < 28) n0 += 10;
	else if (n1 < 28) n1 += 10;

	// 逐日序号
	var k = 1 - delta;
	// 逐日儒略日
	var jdk = jd1 - delta;
	// 逐日干支
	var gzk = jdtogz(jdk);

	// 约二万年以内，显示农历
	if (-5000000 <= jdn && jdn <= 10000000) {
		// 农历月历数据
		var lun = lunc(jdk, tz, (ln - 1) * 7);
		// 查月序号
		var im;
		for (im=0; im<lun.nm.length-2; ++im) {
			if (lun.nm[im+1][0] > jdk) break;
		}
		// 日期
		var ld = jdk - lun.nm[im][0] + 1;
		// 节气索引
		var it = 0;
		// 四分月相索引
		var ip = 0;
	} else document.getElementById("lun").innerHTML = "";

	// 逐行输出月历
	for (var i=0; i<ln; ++i) {
		var row = document.createElement("tr");
		cmc.appendChild(row);
		for (var j=0; j<7; ++j) {
			var cell = document.createElement(i ? "td" : "th");
			row.appendChild(cell);
			if (j == 0) cell.className = "sunday";
			else if (j == 6) cell.className = "saturday";
			if (i == 0) {
				cell.innerHTML = WK[j];
				continue;
			}

			if (jdk == jdn) cell.classList.add("today");
			// 上月
			if (k <= 0) {
				cell.classList.add("other");
				cell.innerHTML = "<div>" + (k + n0) + "</div>";
			// 下月
			} else if (k > n1){
				cell.classList.add("other");
				cell.innerHTML = "<div>" + (k - n1) + "</div>";
			// 本月
			} else {
				cell.innerHTML = "<div class='day'>" + k + "</div>";
			}
			// 干支
			cell.innerHTML += "<div class='aux'>" + TG[gzk%10] + DZ[gzk%12] + "</div>";

			// 如显示农历
			if (lun != undefined) {
				var strd;
				if (ld == 20) strd = "二十";
				else if (ld == 30) strd = "三十";
				else strd = TEN[Math.floor((ld-1)/10)] + NUM[(ld-1)%10+1];
				// 月份
				var lm;
				if (i==1 && j==0 || ld == 1) {
					lm = im - (lun.leap && im>=lun.leap ? 1 : 0) + 11;
					var strm = (lun.leap && im==lun.leap ? "闰" : "") + MON[(lm-1) % 12 + 1] + "月";
					cell.innerHTML += "<div class='aux'>" + strm + strd + "</div>";
				} else {
					cell.innerHTML += "<div class='aux'>" + strd + "</div>";
				}

				// 节气
				if (it < lun.term.length && jdk == lun.term[it][0]) {
					var hms = stot(lun.term[it][1]);
					cell.innerHTML += "<div class='aux'>" + ts(hms.hr, hms.mn, hms.sc) + TERM[lun.term[it][2]] + "</div>";
					++it;
				}

				// 四分月相
				if (ip < lun.phase.length && jdk == lun.phase[ip][0]) {
					var hms = stot(lun.phase[ip][1]);
					cell.innerHTML += "<div class='aux'>" + ts(hms.hr, hms.mn, hms.sc) + PHASE[lun.phase[ip][2]] + "</div>";
					// 朔
					if (lun.phase[ip][2] == 0) {
						var type = secl(jdk, lun.phase[ip][1], tz);
						// 日食
						if (type) cell.innerHTML += "<div class='aux'>" + SECL[type] + "</div>";
					// 望
					} else if (lun.phase[ip][2] == 2) {
						var type = mecl(jdk, lun.phase[ip][1], tz);
						// 月食
						if (type) cell.innerHTML += "<div class='aux'>" + MECL[type] + "</div>";
					}
					++ip;
				}

				if (jdk == jdn) {
					// 年份
					var ly = lun.y + Math.floor((lm-1) / 12) - 1;
					var stry = (ly > 0 ? ly : ("前" + (1-ly))) + "年";
					var strm = (lun.leap && im==lun.leap ? "闰" : "") + ((lm-1) % 12 + 1) + "月";
					var gz = ytogz(ly);
					var strgz = TG[gz%10] + DZ[gz%12] + "(" + (gz+1) + ")";
					document.getElementById("lun").innerHTML = "农历：" + stry + strm + ld + " 岁次" + strgz;
				}

				++ld;
				if (jdk + 1 >= lun.nm[im+1][0]) {
					++im;
					ld = 1;
				}
			}

			// 改历修正
			if (jdk == JD1582_10_4) k += 11;
			else ++k;
			++jdk;
			++gzk;
		}
	}
}

function update_now(time, tz){
	var jd = dtojd(1970, 1, 1, GREGORIAN) + ttojd(0, 0, time/1000, 0);
	update(jd, tz);

	// 选时区
	var tzs = document.getElementById("tz");
	for (var i=0; i<tzs.length; ++i) {
		if (tzs.options[i].value == tz) break;
	}
	// 新增时区
	if (i >= tzs.length) {
		var option = document.createElement("option");
		tzs.appendChild(option);
		option.value = tz;
		option.text = tzs(tz);
	}
	tzs.selectedIndex = i;
}

// 日历转换

// 儒略日数转换为日期
function jdtod(jdn, type){
	var y, m, d;
	if (type == AUTO) type = (jdn <= JD1582_10_4) ? JULIAN : GREGORIAN;
	// 儒略日以-4712年1月1日起算，为方便计算置闰年份，转换为以0年3月1日起算：
	d = jdn - (365*4712+4712/4+31+29);
	// 如果是格里历
	if (type != JULIAN) {
		// 格里历1582年10月15日是儒略历1582年10月4日的次日，两者在0年3月1日的儒略日数之差为：2
		d -= 2;
		// 格里历（逢3200年不置闰）修正
		if (type == GREGORIAN_3200) d += Math.floor(d / G32C);
		// 0年3月1日起算的400年周期数
		var ny = Math.floor(d / G4C);
		// 当前400年周期内的剩余天数
		d -= G4C * ny;
		y = 400 * ny;
		// 格里历逢100年不置闰、逢400年置1闰，修正与儒略历的闰日数之差
		d += Math.floor((4 * d + 3) / G4C);
	// 否则是儒略历
	} else {
		// 0年3月1日起算的4年周期数
		var ny = Math.floor(d / J4Y);
		// 当前4年周期内的剩余天数
		d -= J4Y * ny;
		y = 4 * ny;
	}
	// 当前周期内的年数
	var dy = Math.floor((4 * d + 3) / J4Y);
	// 当年3月1日起算的剩余天数
	d -= 365 * dy + Math.floor(dy / 4);
	// 日历年份
	y += dy;
	// 日历月份
	m = Math.floor((5 * d + 2) / 153) + 3;
	// 日历日期
	d -= Math.floor((153 * m + 3) / 5) - 93;
	// 修正1、2月份
	if (m > 12) {
		m -= 12;
		++y;
	}
	return {y: y, m: m, d: d};
}

// 日期转换为儒略日数
function dtojd(y, m, d, type){
	// 将1、2月份算作上一年的13、14月份
	if (m <= 2) {
		--y;
		m += 12;
	}
	// 先按儒略历计算儒略日数
	d += (365*4712+4712/4-33) + 365 * y + Math.floor(y / 4) + Math.floor((153 * m + 3) / 5);
	if (type == AUTO) type = (d <= JD1582_10_4) ? JULIAN : GREGORIAN;
	// 如果是格里历
	if (type != JULIAN) {
		// 修正格里历与儒略历的儒略日数之差
		d += 2 - Math.floor(y / 100) + Math.floor(y / 400);
		// 格里历（逢3200年不置闰）修正
		if (type == GREGORIAN_3200) d -= Math.floor(y / 3200);
	}
	return d;
}

// 日内秒数转换为时分秒
function stot(sc){
	// 剩余分数
	var t = Math.floor(sc / 60);
	sc -= t * 60;
	// 分
	var mn = t % 60;
	// 时
	var hr = (t - mn) / 60;
	return {hr: hr, mn: mn, sc: sc};
}

// 儒略日小数部分转换为时间
function jdtot(jd, tz){
	// 儒略日以12:00 UTC起算，转换为以当地时间0:00起算
	jd += (12 + tz / 60) / 24;
	// 取整数部分
	var jdn = Math.floor(jd);
	// 小数部分转换为时间
	jd -= jdn;

	// 日内秒数
	var sc = Math.round(jd * 86400);
	if (sc >= 86400) {
		sc -= 86400;
		++jdn;
	}
	return {jdn: jdn, hms: stot(sc)};
}

// 时间转换为儒略日
function ttojd(hr, mn, sc, tz){
	// 时间转换为儒略日，并转换为以12:00 UTC起算
	return (hr - 12 + (mn - tz + sc / 60) / 60) / 24;
}

// 儒略日数转换为玛雅历日期
function jdtomaya(jdn){
	// 转换为玛雅历起算的天数
	var maya = jdn - JD_MAYA;

	// 长计历的循环数
	var pre = Math.floor(maya / MYLC);
	// 循环内的剩余天数
	var t = maya - MYLC * pre;
	// 日（K'in）
	var d = t % 20;
	t = (t - d) / 20;
	// 月（Winal）
	var m = t % 18;
	t = (t - m) / 18;
	// 年（Tun）
	var y = t % 20;
	t = (t - y) / 20;
	// 廿年（K'atun）
	var ty = t % 20;
	// 四百年（B'ak'tun）
	var hy = (t - ty) / 20;

	// 玛雅历起算日的卓尔金历为：4 Ajaw（4-20）
	var tnum = (maya + 4) % 13;
	if (tnum <= 0) tnum += 13;
	var tname = (maya + 20) % 20;
	if (tname <= 0) tname += 20;

	// 玛雅历起算日的哈布历为：8 Kumk'u（8/18）
	var hbd = (maya + (8+20*(18-1))) % 365;
	if (hbd < 0) hbd += 365;
	var hbm = Math.floor(hbd / 20);
	hbd -= hbm++ * 20;

	return {pre: pre, hy: hy, ty: ty, y: y, m: m, d: d, tnum: tnum, tname: tname, hbd: hbd, hbm: hbm};
}

// 玛雅历长计历转换为儒略日数
function mayatojd(pre, hy, ty, y, m, d){
	return ((((pre * 20 + hy) * 20 + ty) * 20 + y) * 18 + m) * 20 + d + JD_MAYA;
}
// 儒略日数转换为星期序号
function jdtow(jdn){
	// 儒略日起算日-4712年1月1日为：周一
	var week = (jdn + 1) % 7;
	// 修正负数
	return (week < 0) ? (week + 7) : week;
}

// 儒略日数转换为干支序号
function jdtogz(jdn){
	// 儒略日的起算日-4712年年1月1日的干支为：癸丑
	var gz = (jdn + (9*6-1*5)) % 60;
	// 修正负数
	return (gz < 0) ? (gz + 60) : gz;
}

// 年份转换为干支序号
function ytogz(y){
	// 公元1024年干支为：甲子
	var gz = (y - 1024) % 60;
	// 修正负数
	return (gz < 0) ? (gz + 60) : gz;
}

// 地球力学时TT与国际原子时TAI之差，s
var TT_TAI = 32.184;

// 地球力学时TT与世界时UT1之差ΔT
// 输入：
//	jdn：儒略日整数部分
//	jdf：儒略日小数部分
// 返回：TT – UT1，s
function tt_ut(jdn, jdf){
	var jd = jdn + jdf;
	var dt;
	// NASA近似拟合算法（http://eclipse.gsfc.nasa.gov/LEcat5/deltatpoly.html）：
	//	ΔT = DT - UT
	//	y = 年 + (月 - 0.5)/12

	// -500年以前、2150年以后：
	if (jd < 1538433 || jd >= 2506332) {
		// u = (y - 1820) / 100
		var u = (jd - 2385801) / JC;
		// ΔT = -20 + 32u²
		dt = -20 + u * u * 32;
	// -500年~500年：
	} else if (jd < 1903683) {
		// u = y / 100
		var u = (jd - 1721058) / JC;
		// ΔT = 10583.6 - 1014.41u + 33.78311u² - 5.952053u³ - 0.1798452u⁴ + 0.022174192u⁵ + 0.0090316521u⁶ 
		dt = 10583.6 + u * (-1014.41 + u * (33.78311 + u * (-5.952053 + u * (-0.1798452 + u * (0.022174192 + u * 0.0090316521)))));
	// 500年~1600年：
	} else if (jd < 2305448) {
		// u = (y - 1000) / 100
		var u = (jd - 2086308) / JC;
		// ΔT = 1574.2 - 556.01u + 71.23472u² + 0.319781u³ - 0.8503463u⁴ - 0.005050998u⁵ + 0.0083572073u⁶
		dt = 1574.2 + u * (-556.01 + u * (71.23472 + u * (0.319781 + u * (-0.8503463 + u * (-0.005050998 + u * 0.0083572073)))));
	// 1600年~1700年：
	} else if (jd < 2341973) {
		// t = y - 1600
		var t = (jd - 2305448) / JY;
		// ΔT = 120 - 0.9808t - 0.01532t² + t³ / 7129
		dt = 120 + t * (-0.9808 + t * (-0.01532 + t / 7129));
	// 1700年~1800年：
	} else if (jd < 2378497) {
		// t = y - 1700
		var t = (jd - 2341973) / JY;
		// ΔT = 8.83 + 0.1603t - 0.0059285t² + 0.00013336t³ - t⁴ / 1174000
		dt = 8.83 + t * (0.1603 + t * (-0.0059285 + t * (0.00013336 - t / 1174000)));
	// 1800年~1860年：
	} else if (jd < 2400411) {
		// t = y - 1800
		var t = (jd - 2378497) / JY;
		// ΔT = 1574.2 - 0.332447t + 0.0068612t² + 0.0041116t³ - 0.00037436t⁴ + 0.0000121272t⁵ - 0.0000001699t⁶ + 0.000000000875t⁷
		dt = 1574.2 + t * (-0.332447 + t * (0.0068612 + t * (0.0041116 + t * (-0.00037436 + t * (0.0000121272 + t * (-0.0000001699 + t * 0.000000000875))))));
	// 1860年~1900年：
	} else if (jd < 2415021) {
		// t = y - 1860
		var t = (jd - 2400411) / JY;
		// ΔT = 7.62 + 0.5737t - 0.251754t² + 0.01680668t³ - 0.0004473624t⁴ + t⁵ / 233174
		dt = 7.62 + t * (0.5737 + t * (-0.251754 + t * (0.01680668 + t * (-0.0004473624 + t / 233174))));
	// 1900年~1920年：
	} else if (jd < 2422325) {
		// t = y - 1900
		var t = (jd - 2415021) / JY;
		// ΔT = -2.79 + 1.494119t - 0.0598939t² + 0.0061966t³ - 0.000197t⁴
		dt = -2.79 + t * (1.494119 + t * (-0.0598939 + t * (0.0061966 - t * 0.000197)));
	// 1920年~1941年：:
	} else if (jd < 2429996) {
		// t = y - 1920
		var t = (jd - 2422325) / JY;
		// ΔT = 21.20 + 0.84493t - 0.076100t² + 0.0020936t³
		dt = 21.20 + t * (0.84493 + t * (-0.076100 + t * 0.0020936));
	// 1941年~1961年：
	} else if (jd < 2437301) {
		// t = y - 1950
		var t = (jd - 2433283) / JY;
		// ΔT = 29.07 + 0.407t - t²/233 + t³ / 2547
		dt = 29.07 + t * (0.407 + t * (-1./233 + t / 2547));
	// 1961年~1986年：
	} else if (jd < 2446432) {
		// t = y - 1975
		var t = (jd - 2442414) / JY;
		// ΔT = 45.45 + 1.067t - t²/260 - t³ / 718
		dt = 45.45 + t * (1.067 + t * (-1./260 - t / 718));
	// 1986年~2005年：
	} else if (jd < 2453372) {
		// t = y - 2000
		var t = (jd - 2451545) / JY;
		// ΔT = 63.86 + 0.3345t - 0.060374t² + 0.0017275t³ + 0.000651814t⁴ + 0.00002373599t⁵
		dt = 63.86 + t * (0.3345 + t * (-0.060374 + t * (0.0017275 + t * (0.000651814 + t * 0.00002373599))));
	// 2005年~2050年：
	} else if (jd < 2469808) {
		// t = y - 2000
		var t = (jd - 2451545) / JY;
		// ΔT = ΔT = 62.92 + 0.32217t + 0.005589t²
		dt = 62.92 + t * (0.32217 + t * 0.005589);
	// 2050年~2150年：
	} else {
		// ΔT = -20 + 32((y - 1820) / 100)² + 0.5628(y - 2150)
		var t = (jd - 2385801) / JC;
		dt = -20 + 32 * t * t + 0.5628 * (jd - 2506332) / JY;
	}
	return dt;
}

// 地球力学时TT与协调世界时UTC之差
// 输入：
//	jdn：儒略日整数部分
//	jdf：儒略日小数部分
// 返回：TT – UTC，s
function tt_utc(jdn, jdf){
	var jd = jdn + jdf;
	for (var i=0; i<TAI_UTC.length; ++i){
		if (jd < TAI_UTC[i][0]) break;
	}
	// UTC之前、或最后一次闰秒10年之后？
	if (--i < 0 || jd > TAI_UTC[TAI_UTC.length-1][0] + (JY*10)) {
		// 应用ut1
		return tt_ut(jdn, jdf);
	}
	return TAI_UTC[i][1] + (jd - TAI_UTC[i][0]) * TAI_UTC[i][2] + TT_TAI;
}

// J2000.0起算的儒略世纪
// 输入：
//	jdn：儒略日整数部分
//	jds：秒数部分，时区地方时
//	tz：时区，分钟差
// 返回：J2000.0起算的儒略世纪，TT
function tjc(jdn, jds, tz){
	var jdf = ((jds / 60 - tz) / 60 - 12) / 24;
	return (jdn - JD2000 + jdf + tt_utc(jdn, jdf) / 86400) / JC;
}

// 计算角度差：
// 输入：
//	deg1、deg2：角度，[0°, 360°)
// 返回：deg1 - deg2，(-180°, 180°]
function ddeg(deg1, deg2){
	var d = deg1 - deg2;
	if (d > 180) d -= 360;
	else if (d <= -180) d += 360;
	return d;
}

// 月相角
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：月相角，[0°, 360)
function mphase(t){
	// 太阳视位置（相对于瞬时平黄道）
	var secl = sunva00(t);
	// 月球视位置（相对于瞬时平黄道）
	var mecl = moonva98(t);
	// 黄经角距，°
	var d = mecl[0] - secl[0];
	// 转换至360°以内
	if (d < 0) d += 360;
	return d;
}

// 牛顿法搜索满足黄经角距的时刻
// 输入：
//	jdn：搜索起点儒略日整数部分
//	jds：搜索起点秒数部分，时区地方时
//	tz：时区，分钟差
//	deg：黄经角距条件，°
//	func：黄经角距计算函数，°
//	TIME：角距周期（搜索节气为平回归年天数，搜索月相为平朔望月天数），天
// 返回：满足黄经角距的儒略日及秒数
function search(jdn, jds, tz, deg, func, TIME){
	// 上一轮误差
	var d0 = 361;
	// 本轮误差
	var delta = 360;
	// 秒数叠代增量，s
	var ds = 0;
	// 误差收敛时
	while (Math.abs(delta) < d0) {
		jds += ds;
		// J2000.0起算的儒略世纪，TT
		var t = tjc(jdn, jds, tz);
		var val = func(t);
		d0 = Math.abs(delta);
		// 角距误差，°
		delta = ddeg(deg, val);
		// 秒数叠代增量，s
		ds = Math.round(delta * (TIME * 240));
		// 无增量
		if (ds == 0) break;
	}
	// 取秒内满足黄经角距的时刻，即10:42:15.51算作10:42:15，正如23:59:59.99是算作当日内一般
	if (delta < 0) --jds;

	// 日数差
	var dd = Math.floor(jds / 86400);
	jdn += dd;
	jds -= dd * 86400;
	return [jdn, jds];
}

// 向前搜索满足黄经角距的时刻（含当前日）
// 输入：
//	jdn：搜索起点儒略日数
//	tz：时区，分钟差
//	deg：黄经角距条件，°
//	func：黄经角距计算函数，°
//	TIME：角距周期（搜索节气为平回归年天数，搜索月相为平朔望月天数），天
// 返回：满足黄经角距的儒略日及秒数
function psearch(jdn, tz, deg, func, TIME){
	// 向前搜索（含当前日）
	var t = tjc(jdn, 86400, tz);
	// 当前日24时
	var val = func(t);
	// 角距误差
	var delta = ddeg(deg, val);
	// 取前一时刻作为起点
	if (delta >= 0) delta -= 360;
	// 搜索起点秒数部分，时区地方时
	var jds = 86400 + Math.round(delta * (TIME * 240));
	// 搜索结果
	return search(jdn, jds, tz, deg, func, TIME);
}

// 农历

// 当年农历数据
// 输入：
//	jdn：儒略日数
//	tz：时区，分钟差
// 返回：
//	mt：中气儒略日及秒数，自当年前冬至起至后冬至（共13个中气）
//	nm：朔日儒略日及秒数，自当年前十一月起至后十二月（共14或15个朔日）
//	leap：十一月起算的闰月序号；无闰月为0
//	y：正月所属年份
function lunar(jdn, tz){
	// 中气，当年冬至起至次年冬至（共13个）
	var mt = [13];
	// 冬至太阳视黄经
	var deg = 270;
	// 搜索前冬至（含当前日）
	mt[0] = psearch(jdn, tz, deg, sunvl00, TROPICAL);
	// 中气角度间距，°
	var dg = 30;
	// 中气秒数间距，s
	var ds = Math.round(dg * (TROPICAL * 240));
	// 搜索后续中气，至次年冬至
	for (var i=1; i<13; ++i) {
		if ((deg += dg) >= 360) deg = 0;
		mt[i] = search(mt[i-1][0], mt[i-1][1]+ds, tz, deg, sunvl00, TROPICAL);
	}

	// 朔日，当年十一月起至次年十二月（共14或15个）
	var nm = [];
	// 搜索前十一月朔日（含前冬至当日）
	nm.push(psearch(mt[0][0], tz, 0, mphase, SYNODIC));
	var n = 1;
	// 朔日秒数间距，s
	ds = Math.round(SYNODIC * 86400);
	// 搜索后续朔日，至次年十二月
	while (nm[n-1][0] <= mt[12][0]) {
		nm.push(search(nm[n-1][0], nm[n-1][1]+ds, tz, 0, mphase, SYNODIC));
		++n;
	}

	var leap = 0;
	// 如果有闰月
	if (nm.length > 14) {
		for (leap=1; leap<12; ++leap) {
			// 如果中气落后至次月，则为闰月
			if (mt[leap][0] >= nm[leap+1][0]) break;
		}
	}
	
	// 前4713年7月30日夏至，儒略日为211，能可靠检测年份
	var y = Math.floor(mt[6][0] / TROPICAL) - 4712;
	return {mt: mt, nm: nm, leap: leap, y:y};
}

// 农历月历数据
// 输入：
//	jdn：月历起始儒略日数
//	tz：时区，分钟差
//	nday：月历天数
// 返回：
//	mt：中气儒略日及秒数，自当年前冬至起
//	nm：朔日儒略日及秒数，自当年前十一月起
//	leap：十一月起算的闰月序号；无闰月为0
//	y：正月所属年份
//	term：月历所覆盖的节气儒略日、秒数及节气序号
//	phase：月历所覆盖的四分月相儒略日、秒数及月相序号
function lunc(jdn, tz, nday){
	// 农历数据
	var lun = lunar(jdn, tz);
	// 如月历延续至次年
	if (lun.nm[lun.nm.length-1][0] < jdn + nday) {
		// 追加次年农历数据
		var lun2 = lunar(lun.mt[12][0], tz);
		for (var i=1; i<13; ++i) lun.mt.push(lun2.mt[i]);
		for (var i=2; i<lun2.nm.length; ++i) lun.nm.push(lun2.nm[i]);
		if (lun2.leap) lun.leap = 12 + lun2.leap;
	}

	// 节气
	lun.term = [];
	// 节气角度间距，°
	var dg = 15;
	// 节气秒数间距，s
	var ds = Math.round(dg * (TROPICAL * 240));
	var i;
	for (i=0; i<lun.mt.length-1; ++i) {
		if (lun.mt[i+1][0] > jdn) break;
	}
	for (; i<lun.mt.length; ++i) {
		var term = lun.mt[i];
		if (term[0] >= jdn + nday) break;
		var id = (i + i + 18) % 24;
		if (term[0] >= jdn) {
			term.push(id)
			lun.term.push(term);
		}
		// 节气黄经
		var deg = id * dg;
		// 搜索后续节气
		term = search(term[0], term[1]+ds, tz, deg+dg, sunvl00, TROPICAL);
		if (term[0] >= jdn + nday) break;
		if (term[0] >= jdn) {
			term.push(id + 1);
			lun.term.push(term);
		}
	}

	// 四分月相
	lun.phase = [];
	// 月相角度间距，°
	dg = 90;
	// 月相秒数间距，s
	ds = Math.round(dg * (SYNODIC * 240));
	for (i=0; i<lun.nm.length-1; ++i) {
		if (lun.nm[i+1][0] > jdn) break;
	}
	for (; i<lun.nm.length; ++i) {
		var phase = lun.nm[i];
		if (phase[0] >= jdn + nday) break;
		if (phase[0] >= jdn) {
			phase.push(0);
			lun.phase.push(phase);
		}
		// 朔日角距
		var deg = 0;
		// 搜索后续月相
		for (var id=1; id<4; ++id) {
			deg += dg;
			phase = search(phase[0], phase[1]+ds, tz, deg, mphase, SYNODIC);
			if (phase[0] >= jdn + nday) break;
			if (phase[0] >= jdn) {
				phase.push(id);
				lun.phase.push(phase);
			}
		}
	}

	return lun;
}

// 儒略日数转换为农历
// 输入：
//	jdn：儒略日数
//	tz：时区，分钟差
// 返回：
//	y、m、d：农历年、月、日
//	leap：当月是否为闰月
//	lun：当年农历数据
function jdtolun(jdn, tz){
	var lun = lunar(jdn, tz);
	var y, m, d, leap = false;

	y = lun.y;
	// 查月序号
	for (m=0; m<lun.nm.length-2; ++m) {
		if (lun.nm[m+1][0] > jdn) break;
	}
	d = jdn - lun.nm[m][0] + 1;

	if (lun.leap) {
		// 当月闰
		if (m == lun.leap) leap = true;
		// 修正闰月之后的月序号
		if (m >= lun.leap) --m;
	}
	// 转换为日历月份
	if (--m <= 0) {
		// 前一年的十一、十二月
		m += 12;
		--y;
	}
	return {y: y, m: m, d: d, leap: leap, lun: lun};
}

// 日月角距（平方数）
// 输入：
//	jdn：儒略日整数部分
//	jds：秒数部分，时区地方时
//	tz：时区，分钟差
//	spf：太阳视位置函数
//	mpf：月球视位置函数
// 返回：
//	[0]：日月角距（平方数）
//	[1]：日地距离，au
//	[2]：地月距离，m
function dsm2(jdn, jds, tz, spf, mpf){
	// J2000.0起算的儒略世纪，TT
	var t = tjc(jdn, jds, tz);
	// 太阳视位置
	var secl = spf(t);
	// 月球视位置
	var mecl = mpf(t);

	var rou = Math.cos(secl[1] * DEG2RAD);
	var sx = rou * Math.cos(secl[0] * DEG2RAD);
	var sy = rou * Math.sin(secl[0] * DEG2RAD);
	var sz = Math.sin(secl[1] * DEG2RAD);

	rou = Math.cos(mecl[1] * DEG2RAD);
	var mx = rou * Math.cos(mecl[0] * DEG2RAD);
	var my = rou * Math.sin(mecl[0] * DEG2RAD);
	var mz = Math.sin(mecl[1] * DEG2RAD);

	var dx = sx - mx;
	var dy = sy - my;
	var dz = sz - mz;
	// 为简化计算，以两点距离近似替代角距。其精确值为：
	//	tg(θ/2) = √[(sx-mx)²+(sy-my)²+(sz-mz)²] / √[(sx+mx)²+(sy+my)²+(sz+mz)²]
	var d2 = dx * dx + dy * dy + dz * dz;
	return [d2, secl[2], mecl[2]];
}

// 二分法搜索日月角距最小时刻
// 输入：
//	jdn：搜索起点儒略日整数部分
//	jds：搜索起点秒数部分，时区地方时
//	tz：时区，分钟差
//	spf：太阳视位置函数
//	mpf：月球视位置函数
// 返回：
//	[0]：日月最小角距，rad
//	[1]：日地距离，au
//	[2]：地月距离，m
function bs(jdn, jds, tz, spf, mpf){
	// 搜索下界
	var l = jds - 5000;
	// 日月角距
	var dl = dsm2(jdn, l, tz, spf, mpf);

	// 搜索下界
	var h = jds + 5000;
	var dh = dsm2(jdn, h, tz, spf, mpf);

	// 搜索中点
	var m = (l + h) >> 1;
	var dm = dsm2(jdn, m, tz, spf, mpf);

	// 二分
	while (h - l > 1) {
		// 日月角距均值
		var d2a = (dl[0] + dm[0] + dh[0]) / 3;
		// 解在中半段
		if (dl[0] > d2a && dh[0] > d2a) {
			// 取前中点
			l = (l + m) >> 1;
			dl = dsm2(jdn, l, tz, spf, mpf);

			// 取后中点
			h = (h + m) >> 1;
			dh = dsm2(jdn, h, tz, spf, mpf);
		} else {
			// 解在前半段
			if (dl[0] < dh[0]) {
				// 舍去后半段
				h = m;
				dh = dm;
			// 解在后半段
			} else {
				// 舍去前半段
				l = m;
				dl = dm;
			}
			// 取新中点
			if (h - l <= 1) break;
			m = (l + h) >> 1;
			dm = dsm2(jdn, m, tz, spf, mpf);
		}
	}

	if (dh[0] < dl[0]) dl = dh;
	return [Math.sqrt(dl[0]), dl[1], dl[2]];
}

// 判断日食
// 输入：
//	jdn：朔日儒略日整数部分
//	jds：朔日秒数部分，时区地方时
//	tz：时区，分钟差
// 返回：日食类型
function secl(jdn, jds, tz){
	// 搜索日月角距最小时刻
	var dsm = bs(jdn, jds, tz, sunva00, moonva98);
	// 太阳视半径，rad
	var sa = (RS / AU) / dsm[1];
	// 月球视半径，rad
	var ma = RM / dsm[2];
	// 地球视半径，rad
	var ea = RE / dsm[2];
	
	// 日食类型
	var type = 0;
	// 进入半影区
	if (dsm[0] < ma + sa + ea) {
		// 进入本影区
		if (dsm[0] < Math.abs(ma - sa) + ea) {
			// 环食
			if (sa > ma) type = 3;
			// 全食
			else type = 2;
			// 偏食
		} else type = 1;
	}
	return type;
}

// 地球本影位置
function eva00(t){
	// 太阳视位置
	var ecl = sunva00(t);
	// 取地球本影位置
	ecl[0] -= 180;
	ecl[1] = -ecl[1];
	return ecl;
}

// 判断月食
// 输入：
//	jdn：望日儒略日整数部分
//	jds：望日秒数部分，时区地方时
//	tz：时区，分钟差
// 返回：月食类型
function mecl(jdn, jds, tz){
	// 搜索日月角距最小时刻
	var dsm = bs(jdn, jds, tz, eva00, moonva98);
	// 太阳视半径，rad
	var sa = (RS / AU) / dsm[1];
	// 月球视半径，rad
	var ma = RM / dsm[2];
	// 地球视半径，rad
	var ea = RE / dsm[2];

	// 月食类型
	var type = 0;
	// 进入半影区
	if (dsm[0] < ea + sa + ma) {
		// 进入本影区
		if (dsm[0] < ea - sa + ma) {
			// 完全进入本影区
			if (dsm[0] < ea - sa - ma) type = 3;
			// 偏食
			else type = 2;
		// 半影
		} else type = 1;
	}
	return type;
}

// 坐标系统旋转矩阵运算

// 坐标系统沿x轴旋转
// 输入：
//	a：旋转角度，rad
//	mv：矩阵或矢量
// 返回：合成矩阵或矢量
function rotx(a, mv){
	var sina = Math.sin(a), cosa = Math.cos(a);
	if (mv == undefined) {
		// 坐标系统沿x轴旋转矩阵
		// |a11 a12 a13|   |1    0      0   |
		// |a21 a22 a23| = |0  cos(a) sin(a)|
		// |a31 a32 a33|   |0 -sin(a) cos(a)|
		return [1, 0, 0,
			0, cosa, sina,
			0, -sina, cosa];
	} else if (mv.length > 3) {
		// 坐标系统沿x轴旋转的合成矩阵
		// |a11' a12' a13'|   |1    0      0   |  |a11 a12 a13|   |         a11                   a12                   a13         |
		// |a21' a22' a23'| = |0  cos(a) sin(a)|×|a21 a22 a23| = |cos(a)*a21+sin(a)*a31 cos(a)*a22+sin(a)*a32 cos(a)*a23+sin(a)*a33|
		// |a31' a32' a33'|   |0 -sin(a) cos(a)|  |a31 a32 a33|   |cos(a)*a31-sin(a)*a21 cos(a)*a32-sin(a)*a22 cos(a)*a33-sin(a)*a23|
		return [mv[0], mv[1], mv[2],
			cosa * mv[3] + sina * mv[6], cosa * mv[4] + sina * mv[7], cosa * mv[5] + sina * mv[8],
			cosa * mv[6] - sina * mv[3], cosa * mv[7] - sina * mv[4], cosa * mv[8] - sina * mv[5]];
	} else {
		// 坐标系统沿x轴旋转后的矢量
		// |x'|   |1    0      0   |  |x|   |        x        |
		// |y'| = |0  cos(a) sin(a)|×|y| = |cos(a)*y+sin(a)*z|
		// |z'|   |0 -sin(a) cos(a)|  |z|   |cos(a)*z-sin(a)*y|
		return [mv[0], cosa * mv[1] + sina * mv[2], cosa * mv[2] - sina * mv[1]];
	}
}

// 坐标系统沿x轴旋转
// 输入：
//	a：旋转角度，rad
//	mv：矩阵或矢量
// 返回：合成矩阵或矢量
function roty(a, mv){
	var sina = Math.sin(a), cosa = Math.cos(a);
	if (mv == undefined) {
		// 坐标系统沿y轴旋转矩阵
		// |a11 a12 a13|   |cos(a) 0 -sin(a)|
		// |a21 a22 a23| = |  0    1    0   |
		// |a31 a32 a33|   |sin(a) 0  cos(a)|
		return [cosa, 0, -sina,
			0, 1, 0,
			sina, 0, cosa];
	} else if (mv.length > 3) {
		// 坐标系统沿y轴旋转的合成矩阵
		// |a11' a12' a13'|   |cos(a) 0 -sin(a)|  |a11 a12 a13|   |cos(a)*a11-sin(a)*a31 cos(a)*a12-sin(a)*a32 cos(a)*a13-sin(a)*a33|
		// |a21' a22' a23'| = |  0    1    0   |×|a21 a22 a23| = |         a21                   a22                   a23         |
		// |a31' a32' a33'|   |sin(a) 0  cos(a)|  |a31 a32 a33|   |sin(a)*a11+cos(a)*a31 sin(a)*a12+cos(a)*a32 sin(a)*a13+cos(a)*a33|
		return [cosa * mv[0] - sina * mv[6], cosa * mv[1] - sina * mv[7], cosa * mv[2] - sina * mv[8],
			mv[3], mv[4], mv[5],
			sina * mv[0] + cosa * mv[6], sina * mv[1] + cosa * mv[7], sina * mv[2] + cosa * mv[8]];
	} else {
		// 坐标系统沿y轴旋转后的矢量
		// |x'|   |cos(a) 0 -sin(a)|  |x|   |cos(a)*x-sin(a)*z|
		// |y'| = |  0    1    0   |×|y| = |        y        |
		// |z'|   |sin(a) 0  cos(a)|  |z|   |sin(a)*x+cos(a)*z|
		return [cosa * mv[0] - sina * mv[2], mv[1], sina * mv[0] + cosa * mv[2]];
	}
}

// 坐标系统沿z轴旋转
// 输入：
//	a：旋转角度，rad
//	mv：矩阵或矢量
// 返回：合成矩阵或矢量
function rotz(a, mv){
	var sina = Math.sin(a), cosa = Math.cos(a);
	if (mv == undefined) {
		// 坐标系统沿z轴旋转的合成矩阵
		// |a11 a12 a13|   | cos(a) sin(a) 0|
		// |a21 a22 a23| = |-sin(a) cos(a) 0|
		// |a31 a32 a33|   |   0      0    1|
		return [cosa, sina, 0,
			-sina, cosa, 0,
			0, 0, 1];
	} else if (mv.length > 3) {
		// 坐标系统沿z轴旋转的合成矩阵
		// |a11' a12' a13'|   | cos(a) sin(a) 0|  |a11 a12 a13|   |cos(a)*a11+sin(a)*a21 cos(a)*a12+sin(a)*a22 cos(a)*a13+sin(a)*a23|
		// |a21' a22' a23'| = |-sin(a) cos(a) 0|×|a21 a22 a23| = |cos(a)*a21-sin(a)*a11 cos(a)*a22-sin(a)*a12 cos(a)*a23-sin(a)*a13|
		// |a31' a32' a33'|   |   0      0    1|  |a31 a32 a33|   |         a31                   a32                   a33         |
		return [cosa * mv[0] + sina * mv[3], cosa * mv[1] + sina * mv[4], cosa * mv[2] + sina * mv[5],
			cosa * mv[3] - sina * mv[0], cosa * mv[4] - sina * mv[1], cosa * mv[5] - sina * mv[2],
			mv[6], mv[7], mv[8]];
	} else {
		// 坐标系统沿z轴旋转后的矢量
		// |x'|   | cos(a) sin(a) 0|  |x|   |cos(a)*x+sin(a)*y|
		// |y'| = |-sin(a) cos(a) 0|×|y| = |cos(a)*y-sin(a)*x|
		// |z'|   |   0      0    1|  |z|   |        z        |
		return [cosa * mv[0] + sina * mv[1], cosa * mv[1] - sina * mv[0], mv[2]];
	}
}

// 矩阵旋转
//	m：旋转矩阵
//	mv：矩阵或矢量
// 返回：合成矩阵或矢量
function rot(m, mv){
	if (mv.length > 3) {
		// 旋转合成矩阵
		// |a11' a12' a13'|   |a11 a12 a13|  |a11" a12" a13"|
		// |a21' a22' a23'| = |a21 a22 a23|×|a21" a22" a23"|
		// |a31' a32' a33'|   |a31 a32 a33|  |a31" a32" a33"|
		return [m[0] * mv[0] + m[1] * mv[3] + m[2] * mv[6], m[0] * mv[1] + m[1] * mv[4] + m[2] * mv[7], m[0] * mv[2] + m[1] * mv[5]+ m[2] * mv[8],
			m[3] * mv[0] + m[4] * mv[3] + m[5] * mv[6], m[3] * mv[1] + m[4] * mv[4] + m[5] * mv[7], m[3] * mv[2] + m[4] * mv[5]+ m[5] * mv[8],
			m[6] * mv[0] + m[7] * mv[3] + m[8] * mv[6], m[6] * mv[1] + m[7] * mv[4] + m[8] * mv[7], m[6] * mv[2] + m[7] * mv[5]+ m[8] * mv[8]];
	} else {
		// 旋转后的矢量
		// |x'|   |a11 a12 a13|  |x|
		// |y'| = |a21 a22 a23|×|y|
		// |z'|   |a31 a32 a33|  |z|
		return [m[0] * mv[0] + m[1] * mv[1] + m[2] * mv[2], m[3] * mv[0] + m[4] * mv[1] + m[5] * mv[2], m[6] * mv[0] + m[7] * mv[1] + m[8] * mv[2]];
	}
}

// 逆矩阵旋转
// 输入：
//	m：旋转矩阵
//	mv：矩阵或矢量
// 返回：合成矩阵或矢量
function rrot(m, mv){
	if (mv.length > 3) {
		// 逆向旋转合成矩阵
		// |a11' a12' a13'|   |a11 a21 a31|  |a11" a12" a13"|
		// |a21' a22' a23'| = |a12 a22 a32|×|a21" a22" a23"|
		// |a31' a32' a33'|   |a13 a23 a33|  |a31" a32" a33"|
		return [m[0] * mv[0] + m[3] * mv[3] + m[6] * mv[6], m[0] * mv[1] + m[3] * mv[4] + m[6] * mv[7], m[0] * mv[2] + m[3] * mv[5]+ m[6] * mv[8],
			m[1] * mv[0] + m[4] * mv[3] + m[7] * mv[6], m[1] * mv[1] + m[4] * mv[4] + m[7] * mv[7], m[1] * mv[2] + m[4] * mv[5]+ m[7] * mv[8],
			m[2] * mv[0] + m[5] * mv[3] + m[8] * mv[6], m[2] * mv[1] + m[5] * mv[4] + m[8] * mv[7], m[2] * mv[2] + m[5] * mv[5]+ m[8] * mv[8]];
	} else {
		// 逆向旋转后的矢量
		// |x'|   |a11 a21 a31|  |x|
		// |y'| = |a12 a22 a32|×|y|
		// |z'|   |a13 a23 a33|  |z|
		return [m[0] * mv[0] + m[3] * mv[1] + m[6] * mv[2], m[1] * mv[0] + m[4] * mv[1] + m[7] * mv[2], m[2] * mv[0] + m[5] * mv[1] + m[8] * mv[2]];
	}
}

// CIO岁差章动模型，IAU2006
// 注：以下IERS相关函数及展开式序列表并非全部必要，仅为保持体系完整性

// 日月、行星基本变量，IERS2003
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：日月、行星基本变量，rad
function farg2003(t){
	// 儒略世纪的小数部分（似乎没这必要）
	var tf = t - Math.floor(t);
	var f = [14];
	// 月球平近点角，rad
	//	l = 134.96340251° + (1325×360° + 715923.2178")t + 31.8792"t² + 0.051635"t³ - 0.00024470"t⁴
	f[0] = (134.96340251 * DEG2RAD) + tf * (1325 * D2PI) + t * (715923.2178 + t * (31.8792 + t * (0.051635 - t * 0.00024470))) * AS2RAD;
	// 太阳平近点角，rad
	//	l' = 357.52910918° + (99×360° + 1292581.0481")t - 0.5532"t² + 0.000136"t³ - 0.00001149"t⁴
	f[1] = (357.52910918 * DEG2RAD) + tf * (99 * D2PI) + t * (1292581.0481 + t * (-0.5532 + t * (0.000136 - t * 0.00001149))) * AS2RAD;
	// 月球平升交角，rad
	//	F = 93.27209062° + (1342×360° + 295262.8478")t - 12.7512"t² - 0.001037"t³ + 0.00000417"t⁴
	f[2] = (93.27209062 * DEG2RAD) + tf * (1342 * D2PI) + t * (295262.8478 + t * (-12.7512 + t * (-0.001037 + t * 0.00000417))) * AS2RAD;
	// 月球平距角，rad
	//	D = 297.85019547° + (1236×360° + 1105601.2090")t - 6.3706"t² + 0.006593"t³ - 0.00003169"t⁴
	f[3] = (297.85019547 * DEG2RAD) + tf * (1236 * D2PI) + t * (1105601.2090 + t * (-6.3706 + t * (0.006593 - t * 0.00003169))) * AS2RAD;
	// 月球轨道升交点黄经，rad
	//	Ω = 125.04455501° - (5×360° + 482890.5431")t + 7.4722"t² + 0.007702"t³ - 0.00005939"t⁴
	f[4] = (125.04455501 * DEG2RAD) - tf * (5 * D2PI) + t * (-482890.5431 + t * (7.4722 + t * (0.007702 - t * 0.00005939))) * AS2RAD;

	// 水星平黄经，rad
	//	LMe = 4.402608842 + 2608.7903141574t
	f[5] = 4.402608842 + t * 2608.7903141574;
	// 金星平黄经，rad
	//	LVe = 3.176146697 + 1021.3285546211t
	f[6] = 3.176146697 + t * 1021.3285546211;
	// 地球平黄经，rad
	//	LE = 1.753470314 + 628.3075849991t
	f[7] = 1.753470314 + t * 628.3075849991;
	// 火星平黄经，rad
	//	LMa = 6.203480913 + 334.0612426700t
	f[8] = 6.203480913 + t * 334.0612426700;
	// 木星平黄经，rad
	//	LJ = 0.599546497 + 52.9690962641t
	f[9] = 0.599546497 + t * 52.9690962641;
	// 土星平黄经，rad
	//	LSa = 0.874016757 + 21.3299104960t
	f[10] = 0.874016757 + t * 21.3299104960;
	// 天王星平黄经，rad
	//	LU = 5.481293872 + 7.4781598567t
	f[11] = 5.481293872 + t * 7.4781598567;
	// 海王星平黄经，rad
	//	LNe = 5.311886287 + 3.8133035638t
	f[12] = 5.311886287 + t * 3.8133035638;
	// 黄经总岁差，rad
	//	pA = 0.024381750t + 0.00000538691t²
	f[13] = t * (0.024381750 + t * 0.00000538691);

	for (var i=0; i<14; ++i) f[i] %= D2PI;
	return f;
}

// 从IERS2010展开式序列表读取累加数据：∑ᵢ[s * sin(ARG) + c * cos(ARG)]
// 输入：
//	table_iers：IERS2010展开式序列表
//	f：日月、行星基本变量
// 返回：累加数据
function get_iers(table_iers, f){
	var sum = 0;
//	for (var i=0; i<table_iers.length; ++i) {
	for (var i=table_iers.length-1; i>=0; --i) {
		// ARG = ∑(N F)
		var arg = 0;
		for (var j=0, k=3; j<14; ++j, ++k) arg += table_iers[i][k] * f[j];
		sum += table_iers[i][1] * Math.sin(arg) + table_iers[i][2] * Math.cos(arg);
	}
	return sum;
}

// CIO定位角，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
//	x、y：CIP天极在GCRS中的X、Y坐标
// 返回：CIO定位角，rad
function cio_s2006(t, f, x, y){
	var sum0 = get_iers(table_iers_s0, f);
	var sum1 = get_iers(table_iers_s1, f);
	var sum2 = get_iers(table_iers_s2, f);
	var sum3 = get_iers(table_iers_s3, f);
	var sum4 = get_iers(table_iers_s4, f);
	// CIO定位角，µas转rad：
	//	s(t) + XY/2 = 94.0 + 3808.65t - 122.68t² - 72574.11t³ + 27.98t⁴ + 15.62t⁵
	//		+ ∑ᵢ[s0 * sin(ARG) + c0 * cos(ARG)]
	//		+ ∑ᵢ[s1 * sin(ARG) + c1 * cos(ARG)]t
	//		+ ∑ᵢ[s2 * sin(ARG) + c2 * cos(ARG)]t²
	//		+ ∑ᵢ[s3 * sin(ARG) + c3 * cos(ARG)]t³
	//		+ ∑ᵢ[s4 * sin(ARG) + c4 * cos(ARG)]t⁴
	var s = (94.0 + t * (3808.65 + t * (-122.68 + t * (-72574.11 + t * (27.98 + t * 15.62))))
		+ sum0 + t * (sum1 + t * (sum2 + t * (sum3 + t * sum4)))) * (AS2RAD / 1000000) - x * y / 2;
	return s;
}

// CIO岁差章动矩阵Q(t)，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
//	bpn：春分点岁差章动矩阵BPN(t)，以便直接从中获取CIP天极的GCRS坐标
// 返回：CIO岁差章动矩阵Q(t)
function cio2006(t, f, bpn){
	// CIP天极的GCRS坐标，直接从春分点岁差章动矩阵中获取
	var x = bpn[6];
	var y = bpn[7];
	var z = bpn[8];
	// CIO定位角，rad
	var s = cio_s2006(t, f, x, y);

	// CIO岁差章动转换矩阵Q(t)：
	//	               |1-X²/(1+Z)  -XY/(1+Z) -X|
	//	Q(t) = R3(-s)×| -XY/(1+Z) 1-Y²/(1+Z) -Y|
	//	               |    X          Y       Z|
	var x2 = x * x;
	var y2 = y * y;
	var k = 1 + z;
	var a12 = -x * y / k;
	return rotz(-s, [1 - x2 / k, a12, -x,
		a12, 1 - y2 / k, -y,
		x, y, z]);
}

// 地球自转角，IAU2006
// 输入：
//	tun：J2000.0起算的儒略日整数部分，UT1
//	tuf：J2000.0起算的儒略日小数部分，UT1
// 返回：地球自转角，rad
function era2006(tun, tuf){
	// TIO与CIO之间的地球自转角：
	//	ERA(Tu) = 2π(0.7790572732640 + 1.00273781191135448Tu)
	var d = 0.7790572732640 + tuf + 0.00273781191135448 * (tun + tuf);
	d -= Math.floor(d);
	return d * D2PI;
}

// 地球自转矩阵R(t)，IAU2006
// 输入：
//	tun：J2000.0起算的儒略日整数部分，UT1
//	tuf：J2000.0起算的儒略日小数部分，UT1
// 返回：地球自转矩阵R(t)
function cio_tio2006(tun, tuf){
	// 地球自转矩阵：R(t) = R3(ERA)
	return rotz(era2006(tun, tuf));
}

// CIO零点差，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
//	bpn：春分点岁差章动矩阵BPN(t)，以便直接从中获取(EO - s)夹角
// 返回：零点差EO，rad
function eo2006(t, f, bpn){
	// CIP天极的GCRS坐标，直接从春分点岁差章动矩阵中获取
	var x = bpn[6];
	var y = bpn[7];

	// Σ点坐标：
	//	xΣ = a11' = 1 – x² / (1 + z)
	//	yΣ = a12' = -xy / (1 + z)
	//	zΣ = a13' = -x
	var ax = x / (1 + z);
	var xsig = 1 - x * ax;
	var ysig = -y * ax;
	var zsig = -x;

	// tg(EO - s) = -cos(EO - s + π/2) / cos(EO - s) = -VΣ V6h / VΣ V♈
	//	= -(xΣ a21 + yΣ a22 + zΣ a23) / (xΣ a11 + yΣ a12 + zΣ a13)
	return s - Math.atan2(xsig * bpn[3] + ysig * bpn[4] + zsig * bpn[5], xsig * bpn[0] + ysig * bpn[1] + zsig * bpn[2]);
}

// 春分点岁差章动模型，IAU2006

// 平黄赤交角
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：平黄赤交角εA，as
function obl2006(t){
	// 平黄赤交角，as：
	//	εA = 84381.406" - 46.836769"t - 0.0001831"t² + 0.00200340"³ - 0.000000576"t⁴ - 0.0000000434"t⁵
	return EPS0 + t * (-46.836769 + t * (-0.0001831 + t * (0.00200340 + t * (-0.000000576 - t * 0.0000000434))));
}

// GCRS赤经岁差，Fukushima−Williams简化法，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：GCRS赤经岁差γ¯，as
function gamb2006(t){
	// 瞬时黄道与GCRS赤道交点的GCRS赤经，as：
	//	γ¯ = -0.052928" + 10.556378"t + 0.4932044"t² - 0.00031238"t³ - 0.000002788"t⁴ + 0.0000000260"t⁵
	return -0.052928 + t * (10.556378 + t * (0.4932044 + t * (-0.00031238 + t * (-0.000002788 + t * 0.0000000260))));
}

// GCRS瞬时黄赤交角，Fukushima−Williams简化法，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：GCRS瞬时黄赤交角φ¯，as
function phib2006(t){
	// 瞬时黄道与GCRS赤道的交角，as：
	//	φ¯ = 84381.412819" - 46.811016"t + 0.0511268"t² + 0.00053289"t³ - 0.000000440"t⁴ - 0.0000000176"t⁵
	return 84381.412819 + t * (-46.811016 + t * (0.0511268 + t * (0.00053289 + t * (-0.000000440 - t * 0.0000000176))));
}

// GCRS黄经岁差，Fukushima−Williams简化法，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：GCRS黄经岁差ψ¯，as
function psib2006(t){
	// 参考架偏差、岁差对黄经岁差贡献总和，as：
	//	ψ¯ = -0.041775" + 5038.481484"t + 1.5584175"t² - 0.00018522"t³ - 0.000026452"t⁴ - 0.0000000148"t⁵
	return -0.041775 + t * (5038.481484 + t * (1.5584175 + t * (-0.00018522 + t * (-0.000026452 - t * 0.0000000148))));
}

// 岁差矩阵BP(t)，Fukushima−Williams简化法，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：岁差矩阵BP(t)
function bp2006(t){
	// 平黄赤交角εA，as
	var epsa = obl2006(t);
	// GCRS赤经岁差γ¯，as
	var gamb = gamb2006(t);
	// GCRS瞬时黄赤交角φ¯，as
	var phib = phib2006(t);
	// GCRS黄经岁差ψ¯，as
	var psib = psib2006(t);
	// 参考架偏移、岁差转换矩阵：BP(t) = R1(-εA) R3(-ψ¯) R1(φ¯) R3(γ¯)
	return rotx(-epsa * AS2RAD, rotz(-psib * AS2RAD, rotx(phib * AS2RAD, rotz(gamb * AS2RAD))));
}

// 黄经章动，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
// 返回：黄经章动Δψ，as
function dpsi2006(t, f){
	var sum0 = get_iers(table_iers_dpsi0, f);
	var sum1 = get_iers(table_iers_dpsi1, f);
	// 黄经章动Δψ，µas转as：
	//	Δψ = ∑ᵢ[s0 * sin(ARG) + c0 * cos(ARG)]
	//		+ ∑ᵢ[s1 * sin(ARG) + c1 * cos(ARG)]t
	return (sum0 + t * sum1) / 1000000;
}

// 交角章动，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
// 返回：交角章动Δε，as
function deps2006(t, f){
	var sum0 = get_iers(table_iers_deps0, f);
	var sum1 = get_iers(table_iers_deps1, f);
	// 交角章动Δε，µas转as：
	//	Δε = ∑ᵢ[s0 * sin(ARG) + c0 * cos(ARG)]
	//		+ ∑ᵢ[s1 * sin(ARG) + c1 * cos(ARG)]t
	return (sum0 + t * sum1) / 1000000;
}

// 岁差章动矩阵BPN(t)，Fukushima−Williams简化法，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
// 返回：岁差章动矩阵BPN(t)
function bpn2006(t, f){
	// 平黄赤交角εA，as
	var epsa = obl2006(t);
	// GCRS赤经岁差γ¯，as
	var gamb = gamb2006(t);
	// GCRS瞬时黄赤交角φ¯，as
	var phib = phib2006(t);
	// GCRS黄经岁差ψ¯，as
	var psib = psib2006(t);
	// 黄经章动Δψ，as
	var dpsi = dpsi2006(t, f);
	// 交角章动Δε，as
	var deps = deps2006(t, f);
	// 参考架偏移、岁差、章动转换矩阵：BPN(t) = R1(-εA-Δε)) R3(-ψ¯-Δψ) R1(φ¯) R3(γ¯)
	return rotx((-epsa - deps) * AS2RAD, rotz((-psib - dpsi) * AS2RAD, rotx(phib * AS2RAD, rotz(gamb * AS2RAD))));
}

// 格林尼治平恒星时，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	tun：J2000.0起算的儒略日整数部分，UT1
//	tuf：J2000.0起算的儒略日小数部分，UT1
// 返回：格林尼治平恒星时，rad
function gmst2006(t, tun, tuf){
	// 格林尼治平恒星时
	//	GMST = ERA(UT1) + 0.014506" + 4612.156534"t + 1.3915817"t² - 0.00000044"t³ - 0.000029956t⁴ - 0.0000000368t⁵
	return era2006(tun, tuf) + (0.014506 + t * (4612.156534 + t * (1.3915817 - t * (0.00000044 + t * (0.000029956 + t * 0.0000000368))))) * AS2RAD;
}

// 格林尼治真恒星时，IAU2006
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
//	f：日月、行星基本变量，rad
//	tun：J2000.0起算的儒略日整数部分，UT1
//	tuf：J2000.0起算的儒略日小数部分，UT1
//	bpn：春分点岁差章动矩阵BPN(t)，以便直接从中获取(EO - s)夹角
// 返回：格林尼治真恒星时，rad
function gst2006(t, f, tun, tuf, bpn){
	// 格林尼治真恒星时：GST = ERA - EO
	return era2006(tun, tuf) - eo2006(t, f, bpn);
}

// 地球自转矩阵R(t)，IAU2006

//	tuf：J2000.0起算的儒略日小数部分，UT1
//	bpn：春分点岁差章动矩阵BPN(t)，以便直接从中获取(EO - s)夹角
// 返回：地球自转矩阵R(t)
function gst_tio2006(t, f, tun, tuf, bpn){
	// 地球自转矩阵：R(t) = R3(GST)
	return rotz(gst2006(t, f, tun, tuf, bpn));
}

// 地球位置（EPV00）
//www.iausofa.org/current-software

// 从EPV00展开式序列表读取累加数据：∑ᵢ[a * cos(b + c * t)]
// 输入：
//	table_epv：EPV00展开式序列表
//	t：J2000.0起算的儒略年，TDB（通常可用TT代替）
// 返回：累加数据
function get_ep(table_epv, t){
	var sum = 0;
	for (var i=0; i<table_epv.length; ++i) {
		sum += table_epv[i][0] * Math.cos(table_epv[i][1] + table_epv[i][2] * t);
	}
	return sum;
}

// 地球位置（相对于EPV00历元平黄道）
// 输入：
//	t：J2000.0起算的儒略年，TDB（通常可用TT代替）
// 返回：地球位置坐标（相对于EPV00历元平黄道），au
function ep00(t){
	// 地球X、Y、Z坐标，au：
	//	∑ᵢ[a0 * cos(b0 + c0 * t)]
	//		+ ∑ᵢ[a1 * cos(b1 + c1 * t)]t
	//		+ ∑ᵢ[a2 * cos(b2 + c2 * t)]t²
	var sum0 = get_ep(table_epv_ex0, t);
	var sum1 = get_ep(table_epv_ex1, t);
	var sum2 = get_ep(table_epv_ex2, t);
	var x = sum0 + t * (sum1 + t * sum2);

	sum0 = get_ep(table_epv_ey0, t);
	sum1 = get_ep(table_epv_ey1, t);
	sum2 = get_ep(table_epv_ey2, t);
	var y = sum0 + t * (sum1 + t * sum2);

	sum0 = get_ep(table_epv_ez0, t);
	sum1 = get_ep(table_epv_ez1, t);
	sum2 = get_ep(table_epv_ez2, t);
	var z = sum0 + t * (sum1 + t * sum2);

	return [x, y, z];
}

// 太阳视位置（相对于瞬时平黄道）
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：
//	[0]：太阳视黄经（相对于瞬时平黄道），[0°, 360°)
//	[1]：太阳视黄纬（相对于瞬时平黄道），[-90°, 90°]
//	[2]：日地距离，au
function sunva00(t){
	// 地球位置坐标，au
	var p = ep00(t * 100);
	// 日地距离，au
	var r = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]);
	// 补偿光行差，儒略年
	var dt = r * (TAU0 / JY / 86400);
	// 重新计算地球位置坐标，au
	p = ep00(t * 100 - dt);
	// 取太阳位置坐标
	p[0] = -p[0];
	p[1] = -p[1];
	p[2] = -p[2];
	// GCRS赤经岁差γ¯，as
	var gamb = gamb2006(t);
	// GCRS瞬时黄赤交角φ¯，as
	var phib = phib2006(t);
	// GCRS黄经岁差ψ¯，as
	var psib = psib2006(t);
	// 先转换至GCRS：R3(0.0475") R1(-84381.4091")
	// 再转换至GCRS与瞬时黄道交点处：R1(φ¯) R3(γ¯)
	//	注：原GCRS岁差转换矩阵（Fukushima−Williams简化法，IAU2006）：BP(t) = R1(-εA) R3(-ψ¯) R1(φ¯) R3(γ¯)
	//	由于仅取黄道坐标，第四次转动不再需要，而第三次转动以黄经直接累加岁差代替
	p = rotx(phib * AS2RAD, rotz((0.0475 + gamb) * AS2RAD, rotx(-84381.4091 * AS2RAD, p)));
	// 取黄经，并累加岁差
	var l = Math.atan2(p[1], p[0]) / DEG2RAD + psib / 3600;
	var rau2 = p[0] * p[0] + p[1] * p[1];
	var b = Math.atan2(p[2], Math.sqrt(rau2)) / DEG2RAD;
	r = Math.sqrt(rau2 + p[2] * p[2]);

	// 转换至360°以内
	if ((l %= 360) < 0) l += 360;
	return [l, b, r];
}

// 太阳视黄经
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：太阳视黄经，[0°, 360°)
function sunvl00(t){
	// 太阳视位置（相对于瞬时平黄道）
	var ecl = sunva00(t);
	// 日月、行星基本变量，rad
	var f = farg2003(t);
	// 黄经章动Δψ，as
	var dpsi = dpsi2006(t, f);
	// 平黄经累加章动
	var l = ecl[0] + dpsi / 3600;
	// 转换至360°以内
	if ((l %= 360) < 0) l += 360;
	return l;
}

////////////////////////////////////////////////////////////////////////////////
// 月球位置（Moon98）
//www.iausofa.org/current-software

// 月球位置（相对于瞬时平黄道）
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：
//	[0]：月球黄经（相对于瞬时平黄道），[0°, 360°)
//	[1]：月球黄纬（相对于瞬时平黄道），[-90°, 90°]
//	[2]：地月距离，m
function moon98(t){
	//	儒略世纪的小数部分
	var tf = t - Math.floor(t);
	// 月球平黄经：
	//	L'= 218.31665436° + (1336×360°+ 307.88123421°)t - 0.0015786°t² + t³/538841.0 - t⁴/65194000.0
	var lpd = (218.31665436 + tf * (1336 * 360) + t * (307.88123421 + t * (-0.0015786 + t * ((1 / 538841.0) - t / 65194000.0)))) % 360;
	var lp = lpd * DEG2RAD;
	// 日月基本变量（D、M、M'、F），rad
	var f = [4];
	// 月球平距角：
	//	D = 297.8501921° + (1236×360° + 307.1114034°)t - 0.0018819°t² + t³/545868.0 + t⁴/113065000.0
	f[0] = (297.8501921 + tf * (1236 * 360) + t * (307.1114034 + t * (-0.0018819 + t * ((1 / 545868.0) + t / 113065000.0)))) % 360 * DEG2RAD;
	// 太阳平近点角：
	//	M = 357.5291092° + (99×360° + 359.0502909°)t - 0.0001536°t² + t³/24490000.0
	f[1] = (357.5291092 + tf * (99 * 360) + t * (359.0502909 + t * (-0.0001536 + t / 24490000.0))) % 360 * DEG2RAD;
	// 月球平近点角：
	//	M' = 134.9633964° + (1325×360° + 198.8675055°)t + 0.0087414°t² + t³/69699.0 - t⁴/14712000.0
	f[2] = (134.9633964 + tf * (1325 * 360) + t * (198.8675055 + t * (0.0087414 + t * ((1 / 69699.0) - t / 14712000.0)))) % 360 * DEG2RAD;
	// 月球平升交角：
	//	F = 93.2720950° + (1342×360° + 82.0175233°)t - 0.0036539°t² + t³/3526000.0 + t⁴/863310000.0
	f[3] = (93.2720950 + tf * (1342 * 360) + t * (82.0175233 + t * (-0.0036539 + t * ((1 / 3526000.0) + t / 863310000.0)))) % 360 * DEG2RAD;

	var l = 0, b = 0, r = 0;
	// 地球轨道偏心率修正因子：E = 1 − 0.002516t − 0.0000074t²
	var e = 1 - t * (0.002516 + t * 0.0000074);
	var e2 = e * e;
	// 月球黄经周期摄动项：∑ᵢ[Eᵏ * s * sin(ARG)]，°
	// 地月距离周期摄动项：∑ᵢ[Eᵏ * c * cos(ARG)]，m
//	for (var i=0; i<table_moon_lr.length; ++i) {
	for (var i=table_moon_lr.length-1; i>=0; --i) {
		// ARG = ∑(N F)
		var arg = 0;
		for (var j=0; j<4; ++j) arg += table_moon_lr[i][j] * f[j];
		// 太阳平近点角相关修正系数：M=±1时为E，M=±2时为E²
		var en = 1;
		var n = Math.abs(table_moon_lr[i][1]);
		if (n == 1) en = e;
		else if (n == 2) en = e2;
		l += en * table_moon_lr[i][4] * Math.sin(arg);
		r += en * table_moon_lr[i][5] * Math.cos(arg);
	}

	// 月球黄纬周期摄动项：∑ᵢ[Eᵏ * s * sin(ARG)]，°
//	for (var i=0; i<table_moon_b.length; ++i) {
	for (var i=table_moon_b.length-1; i>=0; --i) {
		// ARG = ∑(N F)
		var arg = 0;
		for (var j=0; j<4; ++j) arg += table_moon_b[i][j] * f[j];
		// 太阳平近点角相关修正系数：M=±1时为E，M=±2时为E²
		var en = 1;
		var n = Math.abs(table_moon_b[i][1]);
		if (n == 1) en = e;
		else if (n == 2) en = e2;
		b += en * table_moon_b[i][4] * Math.sin(arg);
	}

	// 金星摄动角：119.75°+ 131.849°t
	var a1 = (119.75 + t * 131.849) * DEG2RAD;
	// 木星摄动角：53.09°+ 479264.290°t
	var a2 = (53.09 + t * 479264.290) * DEG2RAD;
	// 月球黄经恒星运动摄动角：313.45°+ 481266.484°t
	var a3 = (313.45 + t * 481266.484) * DEG2RAD;
	// 月球黄经附加项：0.003958°sin(a1) + 0.001962°sin(l' - f) + 0.000318°sin(a2)
	l +=  0.003958 * Math.sin(a1) + 0.001962 * Math.sin(lp - f[3]) + 0.000318 * Math.sin(a2);
	// 月球黄纬附加项：-0.002235°sin(l') + 0.000382°sin(a3) + 0.000175°sin(a1 - f) + 0.000175°sin(a1 + f) + 0.000127°sin(l' - m') - 0.000115°sin(l' + m')
	b += -0.002235 * Math.sin(lp) + 0.000382 * Math.sin(a3) + 0.000175 * Math.sin(a1 - f[3]) + 0.000175 * Math.sin(a1 + f[3]) + 0.000127 * Math.sin(lp - f[2]) - 0.000115 * Math.sin(lp + f[2]);

	// 累加月球平黄经，°
	l += lpd;
	// 累加地月距离常数项，m
	r += 385000560;

	// 转换至360°以内
	if ((l %= 360) < 0) l += 360;
	// 转换至±90°以内
	if ((b %= 360) < -180) b += 360;
	else if (b > 180) b -= 360;
	return [l, b, r];
}

// 月球视位置（相对于瞬时平黄道）
// 输入：
//	t：J2000.0起算的儒略世纪，TDB（通常可用TT代替）
// 返回：
//	[0]：月球视黄经（相对于瞬时平黄道），[0°, 360°)
//	[1]：月球视黄纬（相对于瞬时平黄道），[-90°, 90°]
//	[2]：地月距离，m
function moonva98(t){
	// 月球位置（相对于瞬时平黄道）
	var ecl = moon98(t);
	// 地月距离，m
	var r = ecl[2];
	// 补偿光行差，儒略世纪
	var dt = r / (C * JC * 86400);
	// 重新计算月球位置
	return moon98(t - dt);
}
